name: 'Prepare Release'

# One-click version bump from the Actions tab: enter a version, and this job
# runs scripts/release.sh to bump every manifest + README, commits to the
# main branch, and pushes the v<version> tag — which triggers
# .github/workflows/release.yml to build, sign, and draft the release.
#
# ── Requires a PAT to actually trigger the build ────────────────────────────
# GitHub deliberately does NOT let the built-in GITHUB_TOKEN trigger further
# workflow runs, so a tag pushed with it will NOT start the Release build. Add a
# fine-grained/classic PAT with `contents: write` (repo) as the RELEASE_PAT
# secret and this job uses it to push. Without RELEASE_PAT this workflow stops
# before changing the repository; use the local path in .github/RELEASE_GUIDE.md.
#
# The release notes file must already be committed — this job will not scaffold
# it, so the release can't ship with an empty body. Use scripts/release.sh
# locally to scaffold it, or write it by hand first.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release — X.Y.Z, no leading v'
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    permissions:
      contents: write
    steps:
      - name: require release token
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT is required so the pushed tag can trigger the Release workflow" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Prepare Release must run from main, not ${GITHUB_REF#refs/heads/}" >&2
            exit 1
          fi

      - name: validate version input
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be X.Y.Z with no leading 'v'" >&2
            exit 1
          fi

      - name: require release notes to exist
        run: |
          NOTES="release_notes_${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES is missing — commit it first (scripts/release.sh scaffolds it locally)" >&2
            exit 1
          fi

      - name: bump manifests + README
        run: bash scripts/release.sh "$VERSION"

      - name: verify consistency
        run: bash scripts/check-versions.sh "$VERSION"

      - name: commit, tag & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::manifests already at v${VERSION}; tagging existing commit"
          else
            git commit -m "release: v${VERSION}"
            git push origin HEAD:main
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          echo "::notice::Pushed tag v${VERSION}; the Release build is now running."
