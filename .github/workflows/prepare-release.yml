name: 'Prepare Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release — X.Y.Z, no leading v'
        required: true
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    permissions:
      contents: write
    steps:
      - name: require release token
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT is required so the pushed tag can trigger the Release workflow" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Prepare Release must run from main, not ${GITHUB_REF#refs/heads/}" >&2
            exit 1
          fi

      - name: require release notes to exist
        run: |
          NOTES="release_notes_${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES is missing — commit it first (scripts/release.sh scaffolds it locally)" >&2
            exit 1
          fi

      - name: bump manifests + README
        run: bash scripts/release.sh "$VERSION"

      - name: commit, tag & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock \
            README.md README_EN.md "release_notes_${VERSION}.md"
          if git diff --cached --quiet; then
            echo "::notice::manifests already at v${VERSION}; tagging existing commit"
          else
            git commit -m "release: v${VERSION}"
          fi
          git tag "v${VERSION}"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v${VERSION}"
          echo "::notice::Pushed tag v${VERSION}; the Release build is now running."
