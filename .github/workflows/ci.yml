name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # 版本检查和发布校验脚本测试不依赖 Rust 构建。
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: manifest versions agree
        run: bash scripts/check-versions.sh

      - name: install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: release verification tests
        run: python3 -B -m unittest discover -s scripts -p 'test_verify_release.py' -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      - name: check
        run: bun run check

      - name: test
        run: bun test tests/

      - name: type-check tests
        run: bun run test:types

      - name: build
        run: bun run build

      - name: install browser for UI regression tests
        run: bunx playwright install --with-deps chromium webkit

      - name: browser interaction tests
        run: bun run test:ui

  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      # cargo test builds the Tauri app, which requires frontendDist (dist/)
      # to exist even though the frontend isn't otherwise exercised here.
      - name: build frontend (for frontendDist)
        run: bun run build

      # rustup 按 rust-toolchain.toml 自动安装固定版本的工具链和组件。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: build frontend (for frontendDist)
        run: bun run build

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # The macOS `rust` job above never compiles the `#[cfg(windows)]` clipboard /
  # window FFI, so it can silently rot. Lint it natively on a Windows runner:
  # the MSVC target can't be cross-compiled from macOS because rusqlite's
  # bundled SQLite (C) needs the MSVC toolchain.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      # cargo clippy builds the Tauri app, which requires frontendDist (dist/)
      # to exist even though the frontend isn't otherwise exercised here.
      - name: build frontend (for frontendDist)
        run: bun run build

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
