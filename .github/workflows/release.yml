name: 'Release'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: manifest versions match the tag
        run: bash scripts/check-versions.sh "$GITHUB_REF_NAME"

      - name: release notes present
        run: |
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          if [ ! -f "release_notes_${VERSION_NUM}.md" ]; then
            echo "::error::release_notes_${VERSION_NUM}.md is missing — write it before tagging" >&2
            exit 1
          fi

      - name: verify updater public key continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-release.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --check-key-only

  quality:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  draft-release:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: create or reuse the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IDS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\" and .draft) | .id")
          COUNT=$(printf '%s\n' "$IDS" | grep -c . || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: multiple draft releases exist for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$COUNT" -eq 0 ]; then
            IDS=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="$GITHUB_REF_NAME" \
              -F draft=true -F prerelease=false \
              -F body=@"release_notes_${GITHUB_REF_NAME#v}.md" --jq .id)
          fi
          echo "id=$IDS" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: [preflight, draft-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            cache-key: 'release-macos-aarch64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            cache-key: 'release-macos-x86_64'
          - platform: 'ubuntu-22.04'
            args: ''
            cache-key: 'release-linux'
          - platform: 'windows-latest'
            args: ''
            cache-key: 'release-windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.cache-key }}
          save-if: false

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Extract release notes
        id: release_notes
        shell: bash
        run: |
          NOTES=$(cat "release_notes_${GITHUB_REF_NAME#v}.md")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up self-signed code signing (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/clipleaf-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          CERT_P12="$RUNNER_TEMP/clipleaf-cert.p12"
          CERT_PEM="$RUNNER_TEMP/clipleaf-cert.pem"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_P12"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_P12" -P "$APPLE_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

          security find-certificate -c "ClipLeaf Code Signing" -p "$KEYCHAIN" > "$CERT_PEM"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERT_PEM"

          echo "Valid code-signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q '"ClipLeaf Code Signing"'; then
            echo "ERROR: 'ClipLeaf Code Signing' is not a valid codesigning identity after trust setup" >&2
            exit 1
          fi

      - uses: tauri-apps/tauri-action@7f1a1fc1989f3d1e114195e2a9624d147de78612
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'ClipLeaf Code Signing'
        with:
          releaseId: ${{ needs.draft-release.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  verify-release:
    needs: [publish-tauri, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: verify release assets and updater signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-release.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
          echo '版本、平台、附件及更新签名验证通过；草稿可以进入人工发布检查。' >> "$GITHUB_STEP_SUMMARY"
