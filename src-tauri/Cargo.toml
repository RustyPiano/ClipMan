[package]
name = "clipleaf"
version = "2.6.0"
description = "Modern clipboard manager for Windows, macOS, and Linux"
authors = ["ClipLeaf Team"]
license = "MIT"
repository = "https://github.com/RustyPiano/ClipLeaf"
edition = "2021"
rust-version = "1.96"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-store = "2.4.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2.5.1"
auto-launch = "0.5"
dirs = "6"
tauri-plugin-single-instance = "2"

arboard = "3.4"
enigo = { version = "0.3.0", default-features = false, features = ["x11rb"] }

rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1.40", features = ["sync", "time"] }

data-encoding = "2.6"
sha2 = "0.10"

uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
log = "0.4"
lru = "0.12"
regex = "1"

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clipboard-master = "4.0.0"
tauri-plugin-log = "2.9.2"
ts-rs = "12.0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading"
] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
    "libc",
    "NSApplication",
    "NSPasteboard",
    "NSRunningApplication",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSObject", "NSProcessInfo", "NSString", "NSURL", "NSValue"] }

[dev-dependencies]
ra-ap-rustc_lexer = "0.185.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev.package."*"]
debug = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
