<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var t = localStorage.getItem('clipleaf-theme');
        var m = document.querySelector('meta[name="color-scheme"]');
        if (t === 'ink') {
          m.content = 'dark';
          document.documentElement.dataset.theme = 'ink';
        } else if (t === 'paper') {
          m.content = 'light';
          document.documentElement.dataset.theme = 'paper';
        } else if (t === 'petal') {
          m.content = 'light';
          document.documentElement.dataset.theme = 'petal';
        }
      } catch (e) {}
    </script>
    <title>ClipLeaf — 轻快、干净的本地剪贴板</title>
    <meta
      name="description"
      content="ClipLeaf 是一款轻快、干净的跨平台本地剪贴板工具。粘贴进 Word / PPT 自动去格式不乱排版，几万条历史秒搜，数据只留本机，免费开源。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clipleaf.app/" />
    <meta property="og:title" content="ClipLeaf — 轻快、干净的本地剪贴板" />
    <meta
      property="og:description"
      content="粘贴自动去格式 · 几万条历史秒搜 · 数据只留本机 · 免费开源"
    />
    <meta property="og:image" content="https://clipleaf.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClipLeaf — The fast, clean local clipboard manager." />
    <meta
      name="twitter:description"
      content="Clean plain-text paste · Instant local search · 100% offline & open source."
    />
    <meta name="twitter:image" content="https://clipleaf.app/og.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
